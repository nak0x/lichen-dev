# Pile fédérée wild-fedi : le serveur ActivityPub « wilder » et son client web.
# Le client interroge le serveur par son nom de service interne (`wilder`), donc
# le navigateur n'a jamais besoin d'atteindre le serveur directement.
name: wild-fedi

services:
  # --- Store durable : Postgres (source de vérité, relationnel) --------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wilder
      POSTGRES_PASSWORD: wilder
      POSTGRES_DB: wilder
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wilder -d wilder"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # --- Store volatile : Redis (sessions, fils, files, caches) ----------------
  redis:
    image: redis:7-alpine
    # appendonly : la file de jobs survit à un redémarrage (les fils, eux, sont
    # reconstructibles et peuvent être perdus sans conséquence).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # --- Store objet : Garage (médias, compatible S3) --------------------------
  # `server --single-node` amorce tout seul une disposition de cluster à un
  # nœud ; `--default-bucket` crée (de façon idempotente) la clé d'accès et le
  # bucket à partir des variables GARAGE_DEFAULT_*, et donne à la clé les droits
  # owner sur le bucket. Aucune étape d'initialisation externe n'est donc requise
  # (contrairement à un `garage layout` + `bucket create` manuels).
  garage:
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      # Secret du canal RPC (obligatoire même en mono-nœud). Valeur de dev —
      # à régénérer (`openssl rand -hex 32`) pour un déploiement réel.
      GARAGE_RPC_SECRET: fa4b3fc026435eb38141f03bbe12d64235848d287bc5c276043f82d6e603c37c
      # Clé S3 et bucket par défaut amorcés au démarrage. La clé doit faire ≥ 8
      # caractères et le secret ≥ 16 (contrainte Garage).
      GARAGE_DEFAULT_ACCESS_KEY: wilder-media-key
      GARAGE_DEFAULT_SECRET_KEY: wilder-media-secret-key
      GARAGE_DEFAULT_BUCKET: wilder-media
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garagedata:/var/lib/garage
    ports:
      # 3900 = API S3 (exposée pour un accès depuis l'hôte, ex. aws-cli). Le RPC
      # (3901) reste interne au réseau compose. Garage n'a pas de console web.
      - "3900:3900"
    restart: unless-stopped

  # --- Back : serveur ActivityPub -------------------------------------------
  wilder:
    build:
      context: ./wilder
    image: wild-fedi/wilder
    environment:
      WILDER_BIND: 0.0.0.0:8080
      WILDER_SCHEME: http
      # Le domaine EST l'identité fédérée. Ici, le nom de service interne, que le
      # client sait joindre depuis le réseau compose. À remplacer par un domaine
      # public (et WILDER_SCHEME=https) en production.
      WILDER_DOMAIN: wilder:8080
      DATABASE_URL: postgres://wilder:wilder@postgres:5432/wilder
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://garage:3900
      S3_BUCKET: wilder-media
      S3_ACCESS_KEY: wilder-media-key
      S3_SECRET_KEY: wilder-media-secret-key
      # Doit correspondre à `s3_region` dans garage.toml (entre dans la signature).
      S3_REGION: garage
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      # Garage's single-node bootstrap takes a moment and the image ships no
      # curl for a healthcheck, so we gate on "started" and let wilder retry its
      # bucket check on boot (ensure_bucket backs off for ~30s).
      garage:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      # nodeinfo est public : un 200 signifie « prêt à fédérer ».
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/.well-known/nodeinfo"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # --- Front : client web ----------------------------------------------------
  wilder-web:
    build:
      context: ./wilder-web
    image: wild-fedi/wilder-web
    environment:
      # Config d'exécution Nuxt (préfixe NUXT_ → runtimeConfig).
      NUXT_WILDER_URL: http://wilder:8080
      NUXT_PUBLIC_HOME_HANDLE: beaver-class@wilder:8080
      NUXT_PUBLIC_INSTANCE_NAME: wilder
      HOST: 0.0.0.0
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      # On attend que le serveur soit réellement prêt (RSA + amorçage) avant de
      # démarrer le front, pour que la première requête aboutisse.
      wilder:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  garagedata:
