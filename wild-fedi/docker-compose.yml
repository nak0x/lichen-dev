# Pile fédérée wild-fedi : le serveur ActivityPub « wilder » et son client web.
# Le client interroge le serveur par son nom de service interne (`wilder`), donc
# le navigateur n'a jamais besoin d'atteindre le serveur directement.
name: wild-fedi

services:
  # --- Store durable : Postgres (source de vérité, relationnel) --------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wilder
      POSTGRES_PASSWORD: wilder
      POSTGRES_DB: wilder
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wilder -d wilder"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # --- Store volatile : Redis (sessions, fils, files, caches) ----------------
  redis:
    image: redis:7-alpine
    # appendonly : la file de jobs survit à un redémarrage (les fils, eux, sont
    # reconstructibles et peuvent être perdus sans conséquence).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # --- Store objet : MinIO (médias, compatible S3) ---------------------------
  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: wilder
      MINIO_ROOT_PASSWORD: wilder-secret
    volumes:
      - miniodata:/data
    ports:
      # 9000 = API S3 ; 9001 = console web (pratique en dev, inutile en prod).
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  # --- Back : serveur ActivityPub -------------------------------------------
  wilder:
    build:
      context: ./wilder
    image: wild-fedi/wilder
    environment:
      WILDER_BIND: 0.0.0.0:8080
      WILDER_SCHEME: http
      # Le domaine EST l'identité fédérée. Ici, le nom de service interne, que le
      # client sait joindre depuis le réseau compose. À remplacer par un domaine
      # public (et WILDER_SCHEME=https) en production.
      WILDER_DOMAIN: wilder:8080
      DATABASE_URL: postgres://wilder:wilder@postgres:5432/wilder
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: wilder-media
      S3_ACCESS_KEY: wilder
      S3_SECRET_KEY: wilder-secret
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      # MinIO has no reliable in-image healthcheck binary, so we gate on "started"
      # and let wilder retry bucket creation on boot.
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      # nodeinfo est public : un 200 signifie « prêt à fédérer ».
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/.well-known/nodeinfo"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # --- Front : client web ----------------------------------------------------
  wilder-web:
    build:
      context: ./wilder-web
    image: wild-fedi/wilder-web
    environment:
      # Config d'exécution Nuxt (préfixe NUXT_ → runtimeConfig).
      NUXT_WILDER_URL: http://wilder:8080
      NUXT_PUBLIC_HOME_HANDLE: beaver-class@wilder:8080
      NUXT_PUBLIC_INSTANCE_NAME: wilder
      HOST: 0.0.0.0
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      # On attend que le serveur soit réellement prêt (RSA + amorçage) avant de
      # démarrer le front, pour que la première requête aboutisse.
      wilder:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
